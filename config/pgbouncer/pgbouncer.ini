[databases]
; Route all databases to the postgres container
* = host=postgres port=5432

[pgbouncer]
listen_addr            = 0.0.0.0
; listen_port and max_client_conn are set via PGBOUNCER_PORT and
; PGBOUNCER_MAX_CLIENT_CONN environment variables in docker-compose.
auth_type              = scram-sha-256
auth_file              = /etc/pgbouncer/userlist.txt

; transaction mode is best for Laravel queue workers — connections are
; returned to the pool after each transaction, not held per request.
; NOTE: prepared statements are not supported in transaction mode.
; Add DB_OPTIONS="--no-prepare" or disable prepared statements in Laravel.
pool_mode              = transaction

default_pool_size      = 20
min_pool_size          = 5
reserve_pool_size      = 5
reserve_pool_timeout   = 3

; connection recycling
server_idle_timeout    = 600
client_idle_timeout    = 0
max_db_connections     = 50

; logging (keep minimal in production)
log_connections        = 0
log_disconnections     = 0
log_pooler_errors      = 1
stats_period           = 60

server_tls_sslmode     = disable
