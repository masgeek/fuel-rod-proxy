; =============================================
; Laravel SMS & API Queue Workers - Console-friendly
; =============================================

; SMS Update Queue (Priority 225)
[program:sms-update]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=bash -c "echo '[$(date '+%Y-%m-%d %H:%M:%S')] Starting sms-update queue'; php artisan queue:work --queue=sms-update --sleep=${ENV_QUEUE_SLEEP:-3} --tries=${ENV_QUEUE_MAX_TRIES:-3} --timeout=${ENV_QUEUE_TIMEOUT:-60}; echo '[$(date '+%Y-%m-%d %H:%M:%S')] sms-update queue stopped'"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=${ENV_QUEUE_WORKERS:-2}
stdout_logfile=NONE
redirect_stderr=true
stopwaitsecs=${ENV_QUEUE_TIMEOUT:-60}
priority=225
inherit=defaults

