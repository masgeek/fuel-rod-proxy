; =============================================
; PHP-FPM - Console-friendly Supervisor Config
; =============================================

[program:php-fpm]
command=bash -c "echo '[$(date '+%Y-%m-%d %H:%M:%S')] Starting PHP-FPM'; /usr/local/sbin/php-fpm -F; echo '[$(date '+%Y-%m-%d %H:%M:%S')] PHP-FPM stopped'"
stdout_logfile=NONE
# stderr_logfile removed, merged into stdout
redirect_stderr=true
priority=10       ; Ensure PHP-FPM starts before nginx
autostart=true
autorestart=true
startsecs=0
inherit=defaults
