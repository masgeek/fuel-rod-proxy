; =============================================
; Laravel SMS Processing Queue - Console-friendly
; =============================================

[program:sms-processing-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=bash -c "echo '[$(date '+%Y-%m-%d %H:%M:%S')] Starting SMS processing queue'; php artisan queue:work --sleep=${ENV_QUEUE_SLEEP:-3} --tries=${ENV_QUEUE_MAX_TRIES:-3} --timeout=${ENV_QUEUE_TIMEOUT:-60}; echo '[$(date '+%Y-%m-%d %H:%M:%S')] SMS processing queue stopped'"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=${ENV_QUEUE_WORKERS:-2}
stdout_logfile=NONE
redirect_stderr=true
stopwaitsecs=${ENV_QUEUE_TIMEOUT:-60}
priority=250
inherit=defaults
