; =============================================
; Laravel Queue Workers - Console-friendly
; =============================================

; Callback Queue - Priority 300
[program:callback-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=bash -c "echo '[$(date '+%Y-%m-%d %H:%M:%S')] Starting callback queue worker'; php artisan queue:work --queue=call-back --sleep=${ENV_QUEUE_SLEEP:-3} --tries=${ENV_QUEUE_MAX_TRIES:-3} --timeout=${ENV_QUEUE_TIMEOUT:-60}; echo '[$(date '+%Y-%m-%d %H:%M:%S')] Callback queue worker stopped'"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=${ENV_QUEUE_HEAVY_WORKERS:-2}
stdout_logfile=NONE
redirect_stderr=true
stopwaitsecs=${ENV_QUEUE_TIMEOUT:-60}
priority=300
inherit=defaults

; Map Network Queue - Priority 301
[program:map-network-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=bash -c "echo '[$(date '+%Y-%m-%d %H:%M:%S')] Starting map-network queue worker'; php artisan queue:work --queue=map-network --sleep=${ENV_QUEUE_SLEEP:-3} --tries=${ENV_QUEUE_MAX_TRIES:-3} --timeout=${ENV_QUEUE_TIMEOUT:-60}; echo '[$(date '+%Y-%m-%d %H:%M:%S')] Map-network queue worker stopped'"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=${ENV_QUEUE_HEAVY_WORKERS:-2}
stdout_logfile=NONE
redirect_stderr=true
stopwaitsecs=${ENV_QUEUE_TIMEOUT:-60}
priority=301
inherit=defaults

; =============================================
; Notes:
; - stdout_logfile=NONE & redirect_stderr=true ensures all logs
;   appear in console (Docker/Dozzle friendly).
; - Timestamps added for start/stop messages.
; - Default environment fallbacks provided for sleep, tries, timeout, workers.
; - numprocs allows multiple parallel workers per queue.
; - stopasgroup & killasgroup ensure proper shutdown of all worker processes.
; =============================================
