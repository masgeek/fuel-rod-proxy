; =============================================
; Laravel Zoho Invoice Processing Queue - Console-friendly
; =============================================

[program:laravel-zoho]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=bash -c "echo '[$(date '+%Y-%m-%d %H:%M:%S')] Starting Zoho queue worker'; php artisan queue:work --queue=zoho --sleep=${ENV_QUEUE_SLEEP:-3} --tries=${ENV_QUEUE_MAX_TRIES:-3} --timeout=${ENV_QUEUE_TIMEOUT:-60}; echo '[$(date '+%Y-%m-%d %H:%M:%S')] Zoho queue worker stopped'"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=${ENV_QUEUE_HEAVY_WORKERS:-2}
stdout_logfile=NONE
redirect_stderr=true
stopwaitsecs=${ENV_QUEUE_TIMEOUT:-60}
priority=200
inherit=defaults
