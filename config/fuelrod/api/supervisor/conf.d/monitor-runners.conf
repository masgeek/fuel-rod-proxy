; =============================================
; Laravel Pulse & Horizon - Console-friendly
; =============================================

; Pulse Checker
[program:laravel-pulse]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=bash -c "echo '[$(date '+%Y-%m-%d %H:%M:%S')] Starting laravel-pulse'; php artisan pulse:check; echo '[$(date '+%Y-%m-%d %H:%M:%S')] laravel-pulse stopped'"
autostart=true
autorestart=true
numprocs=1
stdout_logfile=NONE
redirect_stderr=true
stopwaitsecs=3600
priority=200
inherit=defaults

; Pulse Worker
[program:laravel-pulse-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=bash -c "echo '[$(date '+%Y-%m-%d %H:%M:%S')] Starting laravel-pulse-worker'; php artisan pulse:work; echo '[$(date '+%Y-%m-%d %H:%M:%S')] laravel-pulse-worker stopped'"
autostart=true
autorestart=true
numprocs=1
stdout_logfile=NONE
redirect_stderr=true
stopwaitsecs=3600
priority=201
inherit=defaults

; Laravel Horizon
[program:laravel-horizon]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=bash -c "echo '[$(date '+%Y-%m-%d %H:%M:%S')] Starting laravel-horizon'; php artisan horizon; echo '[$(date '+%Y-%m-%d %H:%M:%S')] laravel-horizon stopped'"
autostart=true
autorestart=true
numprocs=1
stdout_logfile=NONE
redirect_stderr=true
stopwaitsecs=3600
priority=202
inherit=defaults
