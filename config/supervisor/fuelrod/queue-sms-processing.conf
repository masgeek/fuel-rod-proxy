; SMS Processing Queue (Priority 250)
; Handles general SMS dispatch on the default fuelrod queue
[program:sms-processing-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=php artisan queue:work --queue=fuelrod --sleep=%(ENV_QUEUE_SLEEP)s --tries=%(ENV_QUEUE_MAX_TRIES)s --timeout=%(ENV_QUEUE_TIMEOUT)s
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_WORKERS)s
stdout_logfile=/var/log/supervisor/sms-processing.log
stderr_logfile=/var/log/supervisor/sms-processing-error.log
stopwaitsecs=%(ENV_QUEUE_TIMEOUT)s
priority=250
inherit=defaults
