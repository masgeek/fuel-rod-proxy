; SMS Resend Queue (Priority 260)
; Handles SendSmsJob and ResendSingleSmsJob dispatched via the sms:send artisan command.
; Isolated from sms-update to prevent manual resend operations from flooding
; the main status-update queue.
[program:sms-resend]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=php artisan queue:work --queue=sms-resend --sleep=%(ENV_QUEUE_SLEEP)s --tries=%(ENV_QUEUE_MAX_TRIES)s --timeout=%(ENV_QUEUE_TIMEOUT)s --max-jobs=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_HEAVY_WORKERS)s
stdout_logfile=/var/log/supervisor/sms-resend.log
stderr_logfile=/var/log/supervisor/sms-resend-error.log
stopwaitsecs=%(ENV_QUEUE_TIMEOUT)s
priority=260
inherit=defaults
