; SMS Archiving Queue (Priority 400)
; Archives sent SMS messages from the sms_outbox table
[program:sms-archiving]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=php artisan queue:work --queue=archive --sleep=%(ENV_QUEUE_SLEEP)s --tries=%(ENV_QUEUE_MAX_TRIES)s --timeout=%(ENV_QUEUE_TIMEOUT)s --max-jobs=200
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_HEAVY_WORKERS)s
stdout_logfile=/var/log/supervisor/sms-archiving.log
stderr_logfile=/var/log/supervisor/sms-archiving-error.log
stopwaitsecs=%(ENV_QUEUE_TIMEOUT)s
priority=400
inherit=defaults
