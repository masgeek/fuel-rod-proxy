; SMS Update Queue (Priority 225)
; Handles SMS delivery status updates via AbstractSmsStatusJob subclasses
[program:sms-update]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=php artisan queue:work --queue=sms-update --sleep=%(ENV_QUEUE_SLEEP)s --tries=%(ENV_QUEUE_MAX_TRIES)s --timeout=%(ENV_QUEUE_TIMEOUT)s --max-jobs=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_WORKERS)s
stdout_logfile=/var/log/supervisor/sms-update.log
stderr_logfile=/var/log/supervisor/sms-update-error.log
stopwaitsecs=%(ENV_QUEUE_TIMEOUT)s
priority=225
inherit=defaults
