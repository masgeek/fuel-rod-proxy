; Campaign Queue (Priority 240)
; Handles SmsCampaignCreationJob, ProcessSmsCampaignJob, and SmsQueueProcessor
; child jobs dispatched from within campaign batches.
[program:campaign-processing]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=php artisan queue:work --queue=campaign --sleep=%(ENV_QUEUE_SLEEP)s --tries=%(ENV_QUEUE_MAX_TRIES)s --timeout=%(ENV_QUEUE_CAMPAIGN_TIMEOUT)s --max-jobs=200
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_WORKERS)s
stdout_logfile=/var/log/supervisor/campaign-processing.log
stderr_logfile=/var/log/supervisor/campaign-processing-error.log
stopwaitsecs=%(ENV_QUEUE_CAMPAIGN_TIMEOUT)s
priority=240
inherit=defaults
