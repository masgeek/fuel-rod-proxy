; API Logs Queue (Priority 401)
; Processes API access log entries asynchronously
[program:api-logs]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=php artisan queue:work --queue=api-logs --sleep=%(ENV_QUEUE_SLEEP)s --tries=%(ENV_QUEUE_MAX_TRIES)s --timeout=%(ENV_QUEUE_TIMEOUT)s --max-jobs=500
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_WORKERS)s
stdout_logfile=/var/log/supervisor/api-logs.log
stderr_logfile=/var/log/supervisor/api-logs-error.log
stopwaitsecs=%(ENV_QUEUE_TIMEOUT)s
priority=401
inherit=defaults
