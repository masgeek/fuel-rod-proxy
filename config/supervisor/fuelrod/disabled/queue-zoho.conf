; Zoho Queue (Priority 200)
; Handles invoice and payment processing via Zoho Books/CRM integration
[program:laravel-zoho]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=php artisan queue:work --queue=zoho --sleep=%(ENV_QUEUE_SLEEP)s --tries=%(ENV_QUEUE_MAX_TRIES)s --timeout=%(ENV_QUEUE_TIMEOUT)s --max-jobs=200
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_HEAVY_WORKERS)s
stdout_logfile=/var/log/supervisor/zoho-processing.log
stderr_logfile=/var/log/supervisor/zoho-processing-error.log
stopwaitsecs=%(ENV_QUEUE_TIMEOUT)s
priority=200
inherit=defaults
