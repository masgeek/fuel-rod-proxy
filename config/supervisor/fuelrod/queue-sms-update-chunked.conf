; SMS Chunked Update Queue (Priority 226)
; Handles bulk SMS status update chunks via sms-update-chunked queue
[program:sms-chunked-update]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/fuelrod
command=php artisan queue:work --queue=sms-update-chunked --sleep=%(ENV_QUEUE_SLEEP)s --tries=%(ENV_QUEUE_MAX_TRIES)s --timeout=%(ENV_QUEUE_TIMEOUT)s --max-jobs=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=%(ENV_QUEUE_HEAVY_WORKERS)s
stdout_logfile=/var/log/supervisor/sms-update-chunked.log
stderr_logfile=/var/log/supervisor/sms-update-chunked-error.log
stopwaitsecs=%(ENV_QUEUE_TIMEOUT)s
priority=226
inherit=defaults
