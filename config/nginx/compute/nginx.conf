http {

  upstream compute_backend {
    least_conn;
    # only compute-1 is primary
    server akilimo-compute-1:80 max_fails=3 fail_timeout=10s;
    # all others are backups and used only when primary is down
    server akilimo-compute-2:80 max_fails=3 fail_timeout=10s backup;
    server akilimo-compute-3:80 max_fails=3 fail_timeout=10s backup;
    server akilimo-compute-4:80 max_fails=3 fail_timeout=10s backup;
    keepalive 32;
  }

  server {
    listen 80;

    # protect worker threads with short connect timeouts
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    location / {
      proxy_pass http://compute_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # try alternate upstreams on common failures
      proxy_next_upstream error timeout http_502 http_503 http_504 http_429;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 10s;
    }

    # map upstream failure codes to an internal fallback
    error_page 502 503 504 = @fallback;

    location @fallback {
      internal;
      default_type application/json;
      add_header Cache-Control "no-store, must-revalidate";
      add_header Content-Type "application/json; charset=utf-8";

      # explicit degraded payload; clients get a stable response rather than HTML error
      return 200 '{"events":{},"status":"degraded","source":"nginx-fallback","timestamp":"'$date_gmt'"}';
    }

    location = /_nginx_health {
      default_type application/json;
      add_header Cache-Control "no-store";
      return 200 '{"nginx":"ok"}';
    }
  }
}
