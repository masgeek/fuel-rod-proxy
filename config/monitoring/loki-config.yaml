auth_enabled: false

server:
  http_listen_port: ${LOKI_HTTP_PORT:-3100}
  grpc_listen_port: ${LOKI_GRPC_PORT:-9096}
  log_level: ${LOKI_LOG_LEVEL:-info}
  grpc_server_max_concurrent_streams: 100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

ingester:
  wal:
    enabled: true
    dir: /loki/wal
  chunk_idle_period: 30m
  max_chunk_age: 2h
  chunk_target_size: 1572864

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: ${LOKI_CACHE_MAX_SIZE_MB:-100}

limits_config:
  metric_aggregation_enabled: true
  reject_old_samples: true
  reject_old_samples_max_age: ${LOKI_REJECT_OLD_SAMPLES_AGE:-168h}
  max_entries_limit_per_query: ${LOKI_MAX_ENTRIES_LIMIT:-5000}
  allow_structured_metadata: true
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/retention
  delete_request_store: filesystem
  retention_enabled: true
  compaction_interval: 10m

ruler:
  enable_alertmanager_discovery: true
  enable_api: true

frontend:
  encoding: protobuf