name: "agwise-api"

# AgWISE API stack — R/Plumber API service.
#
#   api — API server on container port 8000, host port 9630 (loopback only).
#         Not yet exposed publicly; when a domain is assigned, add a Caddyfile
#         and proxy to 127.0.0.1:9630 (see docs/ports.md for the convention).
#
# Runs the prebuilt image iita/agwise-api:<TAG> (default latest). The image is
# built upstream from the iita/agwise-api-base image; no build happens here.
#
# Configuration is read from `.Renviron` (optional; the R environment file,
# loaded by the container at startup). Compose-level knobs (BASE_IMAGE, TAG,
# API_SERVER_URL) come from this stack's .env.
#
# Data and logs are bind-mounted to ./data and ./logs relative to this stack
# directory so they stay directly accessible on the host for backups.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  api:
    container_name: agwise-api
    hostname: agwise-api
    image: iita/agwise-api:${TAG:-latest}
    env_file:
      - path: .Renviron
        required: false
    environment:
      API_SERVER_URL: ${API_SERVER_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:9630:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.1"
