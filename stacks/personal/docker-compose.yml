name: "personal"

# Yamtrack — A self hosted media tracker.
# Requires the 'databases' and 'cache' stacks to be running first.
# postgres and cache are reachable via the shared 'dokploy-network' network.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:${YAMTRACK_TAG:-latest}
    container_name: yamtrack
    hostname: yamtrack
    restart: unless-stopped
    pull_policy: always
    environment:
      DEBUG: ${DEBUG:-false}
      TZ: ${TZ:-UTC}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      SECRET: ${SECRET:?SECRET is required}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379}
      REDIS_PREFIX: ${REDIS_PREFIX:-yamtrack}
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_DATABASE:-yamtrack}
      DB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_PORT: ${DB_PORT:-5432}
      REGISTRATION: ${REGISTRATION:-false}
      TRAKT_API: ${TRAKT_CLIENT_ID}
      TRAKT_API_SECRET: ${TRAKT_CLIENT_SECRET}
      SIMKL_ID: ${SIMKL_CLIENT_ID}
      SIMKL_SECRET: ${SIMKL_CLIENT_SECRET}
      STEAM_API_KEY: ${STEAM_API_KEY}
    ports:
      - "127.0.0.1:9800:8000"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - dokploy-network
      - internal

  mealie:
    image: ghcr.io/mealie-recipes/mealie:${MEALIE_TAG:-v3.20.1} 
    container_name: mealie
    hostname: mealie
    restart: always
    pull_policy: always
    ports:
        - "127.0.0.1:9925:9000" # 
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - mealie-data:/app/data/
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      TZ: America/Anchorage
      BASE_URL: ${MEALIE_BASE_URL:?MEALIE_BASE_URL is required}
      # Database Settings
      DB_ENGINE: ${DB_ENGINE:-postgresql}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_SERVER: ${DB_HOST:-postgres}
      POSTGRES_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${MEALIE_DB_NAME:-mealie}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal


volumes:
  mealie-data:
    name: mealie-data