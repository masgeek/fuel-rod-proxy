name: "fuelrod"

# Application stack — deploy AFTER databases and automation stacks.
# postgres, maria, redis, and n8n are in their own Coolify resources
# and reachable via the shared 'dokploy-network' network.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  fuelrod-uploads:
    driver: local
    name: fuelrod-uploads
  fuelrod-migration:
    driver: local
    name: fuelrod-migration
  sms-data:
    driver: local
    name: sms-data

services:
  fuelrod-init:
    container_name: fuelrod-init-dev
    image: masgeek/fuelrod-service:${FUELROD_TAG:?FUELROD_TAG must be set}
    pull_policy: always
    user: root
    read_only: true
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command:
      - chown -R www-data:www-data /var/www/html/fuelrod/public/uploads /var/www/html/fuelrod/storage/app/migration
    restart: "no"
    volumes:
      - fuelrod-uploads:/var/www/html/fuelrod/public/uploads
      - fuelrod-migration:/var/www/html/fuelrod/storage/app/migration

      
  fuelrod:
    container_name: fuelrod 
    image: masgeek/fuelrod-service:${FUELROD_TAG:?FUELROD_TAG must be set}
    hostname: fuelrod
    restart: unless-stopped
    pull_policy: always
    environment:
      # Application
      APP_NAME: ${APP_NAME:-Fuelrod}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL must be set}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      ASSET_URL: ${ASSET_URL}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  

      # Logging
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-stderr}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      # Database — host must be the postgres service name, not 127.0.0.1
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_SCHEMA: ${DB_SCHEMA:-fuelrod}

      # Cache / Queue / Session
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}

      # Redis — host must be the redis service name, not 127.0.0.1
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      REDIS_HOST: ${REDIS_HOST:-cache}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

      # Mail
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      # MAIL_HOST: ${MAIL_HOST:?MAIL_HOST must be set}
      # MAIL_PORT: ${MAIL_PORT:-587}
      # MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME must be set}
      # MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS must be set}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Fuelrod}

      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:?MAILGUN_DOMAIN must be set}
      MAILGUN_SECRET: ${MAILGUN_SECRET:?MAILGUN_SECRET must be set}


      # Zoho
      ZOHO_REDIRECT_URL: ${ZOHO_REDIRECT_URL:?ZOHO_REDIRECT_URL must be set}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:?ZOHO_CLIENT_ID must be set}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:?ZOHO_CLIENT_SECRET must be set}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:?ZOHO_REFRESH_TOKEN must be set}
      ZOHO_WEBHOOK_SECRET: ${ZOHO_WEBHOOK_SECRET:?ZOHO_WEBHOOK_SECRET must be set}

      # Auth tokens
      ACCESS_TOKEN_EXPIRE_IN: ${ACCESS_TOKEN_EXPIRE_IN:-2880}

      # API logging
      API_LOGGER_ENABLED: ${API_LOGGER_ENABLED:-true}
      API_LOGGER_VERBS: ${API_LOGGER_VERBS:-POST,PUT,PATCH,DELETE}

      # Webhooks
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set}

      # Horizon
      HORIZON_NAME: ${HORIZON_NAME:-Fuelrod}
      #Octane
      OCTANE_HTTPS: ${OCTANE_HTTPS:-false}
      #Supervisor
      HORIZON_ENABLED: "${HORIZON_ENABLED:-false}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-false}"
      LARAVEL_MIGRATE: "${LARAVEL_MIGRATE:-false}"

    volumes:
      - fuelrod-uploads:/var/www/html/fuelrod/public/uploads
      - fuelrod-migration:/var/www/html/fuelrod/storage/app/migration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    depends_on:
      fuelrod-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9200:80"
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s