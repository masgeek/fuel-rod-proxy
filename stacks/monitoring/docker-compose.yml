name: "monitoring"

# Observability stack: Grafana, Prometheus, Loki, Grafana Agent, pg-export, Beszel.
# Requires the 'databases' stack to be running (pg-export connects to postgres).
# The fuelrod-logs volume is shared with the fuelrod stack for log tailing.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  fuelrod-logs:
    name: fuelrod-logs
    driver: local
  prometheus_data:
    driver: local
    name: prometheus-data
  grafana_data:
    driver: local
    name: grafana-data
  loki_data:
    driver: local
    name: loki-data
  agent-data:
    driver: local
    name: agent-data

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    hostname: loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ../../config/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      - LOKI_HTTP_PORT=${LOKI_HTTP_PORT:-3100}
      - LOKI_GRPC_PORT=${LOKI_GRPC_PORT:-9096}
      - LOKI_LOG_LEVEL=${LOKI_LOG_LEVEL:-info}
      - LOKI_CACHE_MAX_SIZE_MB=${LOKI_CACHE_MAX_SIZE_MB:-100}
      - LOKI_REJECT_OLD_SAMPLES_AGE=${LOKI_REJECT_OLD_SAMPLES_AGE:-168h}
      - LOKI_MAX_ENTRIES_LIMIT=${LOKI_MAX_ENTRIES_LIMIT:-5000}
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-168h}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      #test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q 'ready'"]
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    depends_on:
      loki:
        condition: service_started
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA:-public}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:?}
      - REDIS_HOST=${REDIS_HOST:-cache:6379}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?}
      - GF_INSTALL_PLUGINS=redis-datasource
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    ports:
      - "5601:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../config/monitoring/grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ../../config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../../config/monitoring/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    networks:
      - dokploy-network
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    command:
      - '--web.enable-remote-write-receiver'
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - type: bind
        source: ../../config/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready | grep -q 'Prometheus'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  agent:
    image: grafana/agent:latest
    container_name: grafana-agent
    hostname: grafana-agent
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    ports:
      - "12345:12345"
    volumes:
      - fuelrod-logs:/var/log/supervisor:ro
      - ../../config/monitoring/agent:/etc/grafana-agent
      - agent-data:/tmp/agent-data
    entrypoint:
      - /bin/grafana-agent
      - -server.http.address=0.0.0.0:12345
      - -config.file=/etc/grafana-agent/agent.yaml
      - -metrics.wal-directory=/tmp/agent/wal
      - -enable-features=integrations-next
      - -config.expand-env
      - -config.enable-read-api
    environment:
      - LOKI_URL=http://loki:3100
      - JOB_NAME=fuelrod
      - INSTANCE=grafana-agent
      - HOST=${HOSTNAME:-unknown}
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - internal


