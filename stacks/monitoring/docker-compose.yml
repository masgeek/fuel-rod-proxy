name: "monitoring"

# Observability stack: Grafana, Prometheus, Loki, Alloy.
# Application logs are collected from Docker stdout.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  prometheus_data:
    driver: local
    name: prometheus-data
  grafana_data:
    driver: local
    name: grafana-data
  loki_data:
    driver: local
    name: loki-data
  agent-data:
    driver: local
    name: agent-data

services:
  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    hostname: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ../../config/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      LOKI_HTTP_PORT: ${LOKI_HTTP_PORT:-3100}
      LOKI_GRPC_PORT: ${LOKI_GRPC_PORT:-9096}
      LOKI_LOG_LEVEL: ${LOKI_LOG_LEVEL:-info}
      LOKI_CACHE_MAX_SIZE_MB: ${LOKI_CACHE_MAX_SIZE_MB:-64}
      LOKI_REJECT_OLD_SAMPLES_AGE: ${LOKI_REJECT_OLD_SAMPLES_AGE:-168h}
      LOKI_MAX_ENTRIES_LIMIT: ${LOKI_MAX_ENTRIES_LIMIT:-2000}
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
      LOKI_MAX_QUERY_LOOKBACK: ${LOKI_MAX_QUERY_LOOKBACK:-168h}
      LOKI_MAX_QUERY_BYTES_READ: ${LOKI_MAX_QUERY_BYTES_READ:-512MB}
      LOKI_QUERY_TIMEOUT: ${LOKI_QUERY_TIMEOUT:-60s}
      LOKI_MAX_QUERY_PARALLELISM: ${LOKI_MAX_QUERY_PARALLELISM:-4}
      LOKI_TSDB_MAX_QUERY_PARALLELISM: ${LOKI_TSDB_MAX_QUERY_PARALLELISM:-8}
      LOKI_SPLIT_QUERIES_BY_INTERVAL: ${LOKI_SPLIT_QUERIES_BY_INTERVAL:-1h}
      LOKI_INGESTION_RATE_MB: ${LOKI_INGESTION_RATE_MB:-5}
      LOKI_INGESTION_BURST_SIZE_MB: ${LOKI_INGESTION_BURST_SIZE_MB:-10}
    networks:
      - internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.0"

  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - sleep 60 && exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_DATAPROXY_TIMEOUT: ${GRAFANA_DATAPROXY_TIMEOUT:-60}
      GF_DATAPROXY_MAX_CONNS_PER_HOST: ${GRAFANA_MAX_CONNS_PER_HOST:-20}
      GF_DATAPROXY_MAX_IDLE_CONNECTIONS: ${GRAFANA_MAX_IDLE_CONNECTIONS:-20}
    ports:
      - "127.0.0.1:9600:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../config/monitoring/grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ../../config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../../config/monitoring/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - type: bind
        source: ../../config/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ../../config/monitoring/prometheus/rules
        target: /etc/prometheus/rules
        read_only: true

    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9090/-/ready >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

  agent:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    hostname: grafana-alloy
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    expose:
      - "12345"
    volumes:
      - ../../config/monitoring/agent:/etc/alloy:ro
      - agent-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint:
      - /bin/alloy
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: http://loki:3100
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
          cpus: "0.1"


