name: "monitoring"

# Observability stack: Grafana, Prometheus, Loki, Grafana Agent, pg-export, Beszel.
# Requires the 'databases' stack to be running (pg-export connects to postgres).
# The fuelrod-logs volume is shared with the fuelrod stack for log tailing.

networks:
  internal:
    name: internal
    external: false
  coolify:
    name: coolify
    external: true

volumes:
  fuelrod-logs:
    name: fuelrod-logs
    driver: local
  prometheus_data:
    driver: local
    name: prometheus-data
  grafana_data:
    driver: local
    name: grafana-data
  loki_data:
    driver: local
    name: loki-data
  agent-data:
    driver: local
    name: agent-data
  beszel-data:
    driver: local
    name: beszel-data

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    hostname: loki
    depends_on:
      - grafana
      - prometheus
    volumes:
      - loki_data:/loki
      - config/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    environment:
      - POSTGRES_USER=grafana_user
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_HOST=postgres
      - POSTGRES_SCHEMA=fuelrod
      - POSTGRES_SSLMODE=disable
      - POSTGRES_PASSWORD=grafana_user
      - POSTGRES_DB=fuelrod
      - REDIS_HOST=cache:6379
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?}
      - GF_INSTALL_PLUGINS=redis-datasource
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - config/monitoring/grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - config/monitoring/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    networks:
      - coolify
      - internal
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    command:
      - '--web.enable-remote-write-receiver'
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - internal
    restart: unless-stopped

  agent:
    image: grafana/agent:latest
    container_name: grafana-agent
    hostname: grafana-agent
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    volumes:
      - fuelrod-logs:/var/log/supervisor:ro
      - config/monitoring/agent:/etc/grafana-agent
      - agent-data:/tmp/agent-data
    entrypoint:
      - /bin/grafana-agent
      - -server.http.address=0.0.0.0:12345
      - -config.file=/etc/grafana-agent/agent.yaml
      - -metrics.wal-directory=/tmp/agent/wal
      - -enable-features=integrations-next
      - -config.expand-env
      - -config.enable-read-api
    environment:
      - LOKI_URL=http://loki:3100
      - JOB_NAME=fuelrod
      - INSTANCE=grafana-agent
      - HOST=${HOSTNAME:-unknown}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12345/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pg-export:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pg-export
    hostname: pg-export
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${GRAFANA_DB_URL:-postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  monitor:
    hostname: beszel
    image: henrygd/beszel
    container_name: beszel
    restart: unless-stopped
    volumes:
      - beszel-data:/beszel_data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`${BESZEL_DOMAIN}`)"
      - "traefik.http.routers.beszel.entrypoints=https"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.routers.beszel.tls.certresolver=letsencrypt"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
    networks:
      - coolify
      - internal
