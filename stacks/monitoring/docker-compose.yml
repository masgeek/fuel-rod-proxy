name: "monitoring"

# Observability stack: Grafana, Prometheus, Loki, Grafana Agent, pg-export, Beszel.
# Requires the 'databases' stack to be running (pg-export connects to postgres).
# The fuelrod-logs volume is shared with the fuelrod stack for log tailing.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  fuelrod-logs:
    name: fuelrod-logs
    driver: local
  prometheus_data:
    driver: local
    name: prometheus-data
  grafana_data:
    driver: local
    name: grafana-data
  loki_data:
    driver: local
    name: loki-data
  agent-data:
    driver: local
    name: agent-data
  beszel-data:
    driver: local
    name: beszel-data
  beszel-agent-data:
    driver: local
    name: beszel-agent-data

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    hostname: loki
    depends_on:
      - grafana
      - prometheus
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ../../config/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    environment:
      - POSTGRES_USER=grafana_user
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_HOST=postgres
      - POSTGRES_SCHEMA=fuelrod
      - POSTGRES_SSLMODE=disable
      - POSTGRES_PASSWORD=grafana_user
      - POSTGRES_DB=fuelrod
      - REDIS_HOST=cache:6379
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?}
      - GF_INSTALL_PLUGINS=redis-datasource
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    ports:
      - "5601:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../config/monitoring/grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ../../config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../../config/monitoring/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    networks:
      - dokploy-network
      - internal
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    command:
      - '--web.enable-remote-write-receiver'
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - type: bind
        source: ../../config/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
    networks:
      - internal
    restart: unless-stopped

  agent:
    image: grafana/agent:latest
    container_name: grafana-agent
    hostname: grafana-agent
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    volumes:
      - fuelrod-logs:/var/log/supervisor:ro
      - ../../config/monitoring/agent:/etc/grafana-agent
      - agent-data:/tmp/agent-data
    entrypoint:
      - /bin/grafana-agent
      - -server.http.address=0.0.0.0:12345
      - -config.file=/etc/grafana-agent/agent.yaml
      - -metrics.wal-directory=/tmp/agent/wal
      - -enable-features=integrations-next
      - -config.expand-env
      - -config.enable-read-api
    environment:
      - LOKI_URL=http://loki:3100
      - JOB_NAME=fuelrod
      - INSTANCE=grafana-agent
      - HOST=${HOSTNAME:-unknown}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12345/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  monitor:
    hostname: beszel
    image: henrygd/beszel
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - beszel-data:/beszel_data
      - ./beszel_socket:/beszel_socket
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`${BESZEL_DOMAIN}`)"
      - "traefik.http.routers.beszel.entrypoints=websecure"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.routers.beszel.tls.certresolver=letsencrypt"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
    networks:
      - dokploy-network
      - internal

  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # LISTEN: ${BESZEL_AGENT_PORT:-45876}
      LISTEN: /beszel_socket/beszel.sock
      KEY: ${BESZEL_AGENT_KEY:?}
      HUB_URL: ${BESZEL_HUB_URL:-http://beszel:8090}
      TOKEN: ${BESZEL_AGENT_TOKEN:?}