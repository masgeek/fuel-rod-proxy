name: "monitoring"

# Observability stack: Grafana, Prometheus, Loki, Alloy.
# Requires the 'databases' stack to be running for Grafana's Postgres backing store.
# Log volumes from application stacks are mounted as external volumes.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  fuelrod-logs:
    name: fuelrod-logs
    # external: true
  fees-log:
    name: fees-log
    # external: true
  fees-dev-log:
    name: fees-dev-log
    # external: true
  akilimo-logs:
    name: akilimo-logs
    # external: true
  prometheus_data:
    driver: local
    name: prometheus-data
  grafana_data:
    driver: local
    name: grafana-data
  loki_data:
    driver: local
    name: loki-data
  agent-data:
    driver: local
    name: agent-data

services:
  loki:
    image: grafana/loki:3.7.4
    container_name: loki
    hostname: loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ../../config/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    environment:
      LOKI_HTTP_PORT: ${LOKI_HTTP_PORT:-3100}
      LOKI_GRPC_PORT: ${LOKI_GRPC_PORT:-9096}
      LOKI_LOG_LEVEL: ${LOKI_LOG_LEVEL:-info}
      LOKI_CACHE_MAX_SIZE_MB: ${LOKI_CACHE_MAX_SIZE_MB:-100}
      LOKI_REJECT_OLD_SAMPLES_AGE: ${LOKI_REJECT_OLD_SAMPLES_AGE:-168h}
      LOKI_MAX_ENTRIES_LIMIT: ${LOKI_MAX_ENTRIES_LIMIT:-5000}
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    networks:
      - internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - sleep 60 && exec /run.sh
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-public}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      POSTGRES_DB: ${POSTGRES_DB:?}
      REDIS_HOST: ${REDIS_HOST:-cache:6379}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_INSTALL_PLUGINS: redis-datasource
    ports:
      - "127.0.0.1:9600:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../config/monitoring/grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ../../config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../../config/monitoring/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - type: bind
        source: ../../config/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ../../config/monitoring/prometheus/rules
        target: /etc/prometheus/rules
        read_only: true

    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9090/-/ready >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

  agent:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    hostname: grafana-alloy
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    expose:
      - "12345"
    volumes:
      - fuelrod-logs:/var/log/fuelrod:ro
      - fees-log:/var/log/fees:ro
      - fees-dev-log:/var/log/fees-dev:ro
      - akilimo-logs:/var/log/akilimo:ro
      - ../../config/monitoring/agent:/etc/alloy:ro
      - agent-data:/var/lib/alloy
    entrypoint:
      - /bin/alloy
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: http://loki:3100
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m
          cpus: "0.1"


