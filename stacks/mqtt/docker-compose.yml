name: "mqtt"

# EMQX MQTT broker.
# Other stacks can connect through 'dokploy-network' at hostname 'emqx'.
# Host bindings default to loopback so the broker and dashboard are not public.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  emqx-data:
    driver: local
    name: emqx-data
  emqx-log:
    driver: local
    name: emqx-log

services:
  emqx:
    image: emqx/emqx:${EMQX_VERSION:-latest}
    container_name: emqx
    hostname: emqx
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_BIND_ADDRESS:-127.0.0.1}:${MQTT_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: emqx
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?EMQX_NODE_COOKIE is required}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD is required}
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - dokploy-network
      - internal
    deploy:
      resources:
        limits:
          memory: ${EMQX_MEMORY_LIMIT:-1g}
          cpus: "${EMQX_CPU_LIMIT:-1.0}"
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
