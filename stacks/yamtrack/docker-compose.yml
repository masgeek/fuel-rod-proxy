name: "yamtrack"

# Yamtrack — A self hosted media tracker.
# Requires the 'databases' and 'cache' stacks to be running first.
# postgres and cache are reachable via the shared 'dokploy-network' network.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:${YAMTRACK_TAG:-latest}
    container_name: yamtrack
    hostname: yamtrack
    restart: unless-stopped
    pull_policy: always
    environment:
      DEBUG: ${DEBUG:-false}
      TZ: ${TZ:-UTC}
      SECRET: ${SECRET:?SECRET is required}
      REDIS_URL: ${REDIS_URL:-redis://cache:6379}
      REDIS_PREFIX: ${REDIS_PREFIX:-yamtrack}
      DB_HOST: ${DB_HOST:-postgres}
      DB_NAME: ${DB_DATABASE:-yamtrack}
      DB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_PORT: ${DB_PORT:-5432}
      REGISTRATION: ${REGISTRATION:-false}
      TRAKT_API: ${TRAKT_CLIENT_ID}}
      TRAKT_API_SECRET: ${TRAKT_CLIENT_SECRET}
    ports:
      - "127.0.0.1:9800:8000"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - dokploy-network
      - internal
