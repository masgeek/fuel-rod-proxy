name: "yamtrack"

# Yamtrack — A self hosted media tracker.
# Requires the 'databases' and 'cache' stacks to be running first.
# postgres and cache are reachable via the shared 'dokploy-network' network.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:${YAMTRACK_TAG:-latest}
    container_name: yamtrack
    hostname: yamtrack
    restart: unless-stopped
    pull_policy: always
    environment:
      TZ: ${TZ:-UTC}
      SECRET: ${YAMTRACK_SECRET:?YAMTRACK_SECRET is required}
      REDIS_URL: ${YAMTRACK_REDIS_URL:-redis://cache:6379}
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_NAME: ${YAMTRACK_DB:-yamtrack}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "127.0.0.1:9800:8000"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - dokploy-network
      - internal
