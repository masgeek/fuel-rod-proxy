name: "caddy-manager"

# Caddy Manager stack — web UI + REST API for managing Caddy sites.
#
#   migrate — runs DB migrations and seeds the initial admin on deploy
#             (restart: no; idempotent).
#   api     — REST API on container port 3500, host port 9620 (loopback only,
#             not exposed publicly).
#   web     — UI (nginx) on container port 80, host port 9621 (loopback only),
#             public via Caddy at caddy.munywele.co.ke
#             (see stacks/caddy-manager/Caddyfile).
#
# Database: reuses the shared Postgres stack (hostname `postgres` on
# dokploy-network). The `caddy` database must exist before first start:
#   docker exec postgres createdb --username "$POSTGRES_USER" \
#     --owner "$POSTGRES_USER" caddy
# Migrations run automatically via the migrate service on each deploy.
#
# Images are prebuilt and pulled as masgeek/caddy-manager-*:<TAG>; no build
# happens here.
#
# Caddy admin communication: the api manages the host's Caddy admin API. Caddy
# only binds its admin endpoint to localhost by default, so the host Caddyfile
# must bind it to the docker bridge (private, not publicly reachable):
#
#   {
#       admin 172.17.0.1:2019
#   }
#
# and the Caddy server is registered in CaddyManager with the API URL
# http://host.docker.internal:2019 (host-gateway, wired up via extra_hosts on
# the api service).

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  migrate:
    container_name: caddy-manager-migrate
    hostname: caddy-manager-migrate
    image: masgeek/caddy-manager-migrate:${TAG:-latest}
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      DB_USER: ${DB_USERNAME:-caddy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-caddy}
      SEED_EMAIL: ${SEED_EMAIL:-admin@caddy.local}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD is required}
      SEED_ROLE: ${SEED_ROLE:-admin}
    networks:
      - internal
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
        reservations:
          memory: 64m
          cpus: "0.05"

  api:
    container_name: caddy-manager-api
    hostname: caddy-manager-api
    image: masgeek/caddy-manager-api:${TAG:-latest}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3500
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SITE_CHECK_CRON: ${SITE_CHECK_CRON:-*/5 * * * *}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CADDY_ADMIN_TOKEN: ${CADDY_ADMIN_TOKEN:-}
      CADDY_ALLOWED_HOSTS: ${CADDY_ALLOWED_HOSTS:?CADDY_ALLOWED_HOSTS is required}
      ALLOW_PRIVATE_OUTBOUND: ${ALLOW_PRIVATE_OUTBOUND:-false}
      DB_USER: ${DB_USERNAME:-caddy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-caddy}
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3500/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9620:3500"
    networks:
      - internal
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"

  web:
    container_name: caddy-manager-web
    hostname: caddy-manager-web
    image: masgeek/caddy-manager-web:${TAG:-latest}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:9621:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
        reservations:
          memory: 64m
          cpus: "0.05"
