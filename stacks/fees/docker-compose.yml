name: "fees"

# Fees stack — deploy AFTER the databases stack.
# postgres and redis are reachable via the shared 'dokploy-network' network.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  fee.prod:
    container_name: fee.prod
    image: masgeek/fee-syncer:${SYNCER_TAG:?SYNCER_TAG must be set}
    hostname: fee.prod
    restart: unless-stopped
    environment:
      QUEUE_WORKERS: ${QUEUE_WORKERS:-1}
      QUEUE_HEAVY_WORKERS: ${QUEUE_HEAVY_WORKERS:-1}
      QUEUE_MAX_TRIES: ${QUEUE_MAX_TRIES:-3}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-3600}
      QUEUE_SLEEP: ${QUEUE_SLEEP:-3}
      PHP_FPM_PM_MAX_CHILDREN: ${PHP_FPM_PM_MAX_CHILDREN:-50}
      PHP_FPM_PM_START_SERVERS: ${PHP_FPM_PM_START_SERVERS:-10}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${PHP_FPM_PM_MIN_SPARE_SERVERS:-7}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${PHP_FPM_PM_MAX_SPARE_SERVERS:-15}
      QUEUE_ENABLED: ${QUEUE_ENABLED_PROD:-true}
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    volumes:
      - ../../log/supervisor/fees.prod:/var/log/supervisor
      - ../../config/supervisor/common:/etc/supervisor/conf.d
      - ../../config/supervisor/fees/sync_student_data.conf:/etc/supervisor/conf.d/sync_student_data.conf
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

  fee.dev:
    container_name: fee.dev
    image: masgeek/fee-syncer:${SYNCER_TAG:?SYNCER_TAG must be set}
    hostname: fee.dev
    restart: unless-stopped
    environment:
      QUEUE_WORKERS: ${QUEUE_WORKERS:-1}
      QUEUE_HEAVY_WORKERS: ${QUEUE_HEAVY_WORKERS:-1}
      QUEUE_MAX_TRIES: ${QUEUE_MAX_TRIES:-3}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-3600}
      QUEUE_SLEEP: ${QUEUE_SLEEP:-3}
      PHP_FPM_PM_MAX_CHILDREN: ${PHP_FPM_PM_MAX_CHILDREN:-50}
      PHP_FPM_PM_START_SERVERS: ${PHP_FPM_PM_START_SERVERS:-10}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${PHP_FPM_PM_MIN_SPARE_SERVERS:-7}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${PHP_FPM_PM_MAX_SPARE_SERVERS:-15}
      QUEUE_ENABLED: ${QUEUE_ENABLED_DEV:-false}
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    volumes:
      - ../../log/supervisor/fees.dev:/var/log/supervisor
      - ../../config/supervisor/common:/etc/supervisor/conf.d
      - ../../config/supervisor/fees/sync_student_data.conf:/etc/supervisor/conf.d/sync_student_data.conf
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
