name: "akilimo"

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  akilimo-site:
      image: wordpress:php8.4-fpm
      container_name: akilimo-site
      hostname: akilimo-site
      restart: always
      ports:
        # Binds port 9000 strictly to localhost so Caddy can reach it safely
        - "127.0.0.1:9000:9000"
      volumes:
        # Mounts your custom storage folder to the container's working directory
        - /mnt/data/extra_storage/services/akilimo:/var/www/html
        # Mirrors the host path inside the container so .user.ini auto_prepend_file path resolves correctly
        - /mnt/data/extra_storage/services/akilimo:/home/akilimo/extra_storage/services/akilimo
      environment:
        TZ: Africa/Nairobi
      networks:
        - dokploy-network
        - internal
  akilimo-portal:
    image: wordpress:php8.4-fpm
    container_name: akilimo-portal
    hostname: akilimo-portal
    restart: always
    ports:
      - "127.0.0.1:9001:9000"
    volumes:
      - /mnt/data/extra_storage/services/portal:/var/www/html
      # Mirrors the host path inside the container so .user.ini auto_prepend_file path resolves correctly
      - /mnt/data/extra_storage/services/portal:/home/akilimo/extra_storage/services/portal
    environment:
      TZ: Africa/Nairobi
    networks:
      - dokploy-network
      - internal
  new-akilimo:
    image: wordpress:php8.4-fpm
    container_name: new-akilimo
    hostname: new-akilimo
    restart: always
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - /mnt/data/extra_storage/services/new_akilimo:/var/www/html
      # Mirrors the host path inside the container so .user.ini auto_prepend_file path resolves correctly
      - /mnt/data/extra_storage/services/new_akilimo:/home/akilimo/extra_storage/services/new_akilimo
    environment:
      TZ: Africa/Nairobi
    networks:
      - dokploy-network
      - internal
  api:
    container_name: akilimo-api
    image: iita/akilimo-api:${AKILIMO_TAG:?AKILIMO_TAG must be set}
    hostname: akilimo-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9000"
    environment:
      # Application
      APP_NAME: ${APP_NAME:-Akilimo API}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_URL: ${APP_URL:?APP_URL must be set}
      AKILIMO_COMPUTE_BASE_URL: ${AKILIMO_COMPUTE_BASE_URL:?AKILIMO_COMPUTE_BASE_URL must be set}
      # Database
      DB_CONNECTION: ${DB_CONNECTION:-mariadb}
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_TYPE: ${DB_TYPE:-mysql}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set}
      # Cache & session
      CACHE_STORE: ${CACHE_STORE:-redis}
      CACHE_TTL: ${CACHE_TTL:-30s}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # Queue
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      QUEUE_WORKERS: ${QUEUE_WORKERS:-5}
      QUEUE_MAX_TRIES: ${QUEUE_MAX_TRIES:-3}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-3600}
      QUEUE_SLEEP: ${QUEUE_SLEEP:-3}
      ENV_QUEUE_TIMEOUT: ${ENV_QUEUE_TIMEOUT:-60}
      AUTO_RECOVER_FAILED_MIGRATIONS: ${AUTO_RECOVER_FAILED_MIGRATIONS:-false}
      # Logging
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Filesystem
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      # Mail
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@akilimo.org}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Akilimo}
      # PHP-FPM
      PHP_FPM_PM_MAX_CHILDREN: ${PHP_FPM_PM_MAX_CHILDREN:-50}
      PHP_FPM_PM_START_SERVERS: ${PHP_FPM_PM_START_SERVERS:-5}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${PHP_FPM_PM_MIN_SPARE_SERVERS:-5}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${PHP_FPM_PM_MAX_SPARE_SERVERS:-10}
    volumes:
      - ../../config/supervisor/common:/etc/supervisor/conf.d
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
