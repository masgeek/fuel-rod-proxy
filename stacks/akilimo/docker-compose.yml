name: "akilimo"

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  metabase-data:
    driver: local
    name: metabase
  beszel-agent-data:
    driver: local
    name: beszel-agent-data

services:
  api:
    container_name: api
    image: iita/akilimo-api:${AKILIMO_TAG:?AKILIMO_TAG must be set}
    hostname: api
    restart: unless-stopped
    environment:
      - QUEUE_WORKERS=${Q_WORKERS:-5}
      - QUEUE_MAX_TRIES=${Q_MAX_TRIES:-3}
      - QUEUE_TIMEOUT=${Q_TIMEOUT:-3600}
      - QUEUE_SLEEP=${Q_SLEEP:-3}
      - PHP_FPM_PM_MAX_CHILDREN=${FPM_MAX_CHILDREN:-50}
      - PHP_FPM_PM_START_SERVERS=${FPM_START_SERVERS:-5}
      - PHP_FPM_PM_MIN_SPARE_SERVERS=${FPM_MIN_SPARE:-5}
      - PHP_FPM_PM_MAX_SPARE_SERVERS=${FPM_MAX_SPARE:-10}
    volumes:
      - ./config/supervisor/common:/etc/supervisor/conf.d
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akilimo.rule=Host(`${AKILIMO_DOMAIN}`)"
      - "traefik.http.routers.akilimo.entrypoints=websecure"
      - "traefik.http.routers.akilimo.tls=true"
      - "traefik.http.routers.akilimo.tls.certresolver=letsencrypt"
      - "traefik.http.services.akilimo.loadbalancer.server.port=80"
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 3600s
      timeout: 10s
      retries: 5
      start_period: 120s

  # compute:
  #   hostname: compute
  #   image: iita/akilimo-compute:${COMPUTE_VERSION:?COMPUTE_VERSION must be set}
  #   volumes:
  #     - ${VOLUME_PATH:-./akilimo-recommendations}:/home/akilimo/projects/akilimo_recommendation:rw
  #   restart: unless-stopped
  #   deploy:
  #     replicas: ${COMPUTE_REPLICAS:-1}
  #   networks:
  #     - dokploy-network
  #     - internal

  # compute-proxy:
  #   image: nginx:alpine
  #   container_name: akilimo.compute
  #   hostname: akilimo.compute
  #   depends_on:
  #     - compute
  #   volumes:
  #     - config/nginx/compute/nginx.conf:/etc/nginx/nginx.conf:ro
  #   restart: on-failure
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.akilimo-compute.rule=Host(`${AKILIMO_COMPUTE_DOMAIN}`)"
  #     - "traefik.http.routers.akilimo-compute.entrypoints=websecure"
  #     - "traefik.http.routers.akilimo-compute.tls=true"
  #     - "traefik.http.routers.akilimo-compute.tls.certresolver=letsencrypt"
  #     - "traefik.http.services.akilimo-compute.loadbalancer.server.port=80"
  #   networks:
  #     - dokploy-network
  #     - internal

  use-uptake:
    container_name: use-uptake
    hostname: use-uptake
    image: iita/use-uptake:1.0.0
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.use-uptake.rule=Host(`${USE_UPTAKE_DOMAIN}`)"
      - "traefik.http.routers.use-uptake.entrypoints=websecure"
      - "traefik.http.routers.use-uptake.tls=true"
      - "traefik.http.routers.use-uptake.tls.certresolver=letsencrypt"
      - "traefik.http.services.use-uptake.loadbalancer.server.port=4242"
    networks:
      - dokploy-network
      - internal

  mbase:
    container_name: mbase
    hostname: metabase
    image: metabase/metabase
    restart: unless-stopped
    # environment:
    #   MB_DB_TYPE: ${DB_TYPE:-postgres}
    #   MB_DB_DBNAME: metabase
    #   MB_DB_PORT: ${DB_PORT:-5432}
    #   MB_DB_USER: ${DB_USERNAME}
    #   MB_DB_PASS: ${DB_PASSWORD}
    #   MB_DB_HOST: ${DB_HOST:-postgres}
    volumes:
      - metabase-data:/metabase-data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`${METABASE_DOMAIN}`)"
      - "traefik.http.routers.metabase.entrypoints=websecure"
      - "traefik.http.routers.metabase.tls=true"
      - "traefik.http.routers.metabase.tls.certresolver=letsencrypt"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
    networks:
      - dokploy-network
      - internal

  dozzle:
    container_name: dozzle
    hostname: dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    networks:
      - dokploy-network
      - internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOZZLE_HOSTNAME: ${DOZZLE_HOSTNAME}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`${DOZZLE_DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel-agent-data:/var/lib/beszel-agent
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_KEY:-beszeldevkey}
      TOKEN: ${BESZEL_TOKEN:-beszeldevtoken}
      HUB_URL: ${BESZEL_HUB_URL:-http://localhost:9699}
    networks:
      - internal
