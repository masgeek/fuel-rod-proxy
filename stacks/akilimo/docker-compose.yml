name: "akilimo"

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

services:
  api:
    container_name: api
    image: iita/akilimo-api:${AKILIMO_TAG:?AKILIMO_TAG must be set}
    hostname: api
    restart: unless-stopped
    environment:
      - QUEUE_WORKERS=${Q_WORKERS:-5}
      - QUEUE_MAX_TRIES=${Q_MAX_TRIES:-3}
      - QUEUE_TIMEOUT=${Q_TIMEOUT:-3600}
      - QUEUE_SLEEP=${Q_SLEEP:-3}
      - PHP_FPM_PM_MAX_CHILDREN=${FPM_MAX_CHILDREN:-50}
      - PHP_FPM_PM_START_SERVERS=${FPM_START_SERVERS:-5}
      - PHP_FPM_PM_MIN_SPARE_SERVERS=${FPM_MIN_SPARE:-5}
      - PHP_FPM_PM_MAX_SPARE_SERVERS=${FPM_MAX_SPARE:-10}
    volumes:
      - ./config/supervisor/common:/etc/supervisor/conf.d
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akilimo.rule=Host(`${AKILIMO_DOMAIN}`)"
      - "traefik.http.routers.akilimo.entrypoints=websecure"
      - "traefik.http.routers.akilimo.tls=true"
      - "traefik.http.routers.akilimo.tls.certresolver=letsencrypt"
      - "traefik.http.services.akilimo.loadbalancer.server.port=80"
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

