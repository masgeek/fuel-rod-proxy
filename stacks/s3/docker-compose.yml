name: "s3"

# Object storage stack — S3-compatible API (MinIO, pgsty community fork) for
# app file uploads and secure (presigned) URL sharing. The fork restores the
# admin console that upstream MinIO removed and continues shipping releases
# (upstream minio/minio is archived and no longer maintained).
#
# Single container: S3 API on port 9000, admin console on port 9001. Config is
# fully env-driven (no config file); credentials come from env vars
# (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD, set in Dokploy).
#
# Public access flows through Caddy: s3.<domain> -> S3 API (host 9612). MinIO
# verifies SigV4 signatures against the Host header it receives, and presigned
# URLs are generated client-side from the endpoint the SDK is given, so no
# special redirect/fid routing is needed behind the reverse proxy.
#
# The console is admin tooling, so it is NOT exposed via Caddy — it binds to
# 127.0.0.1:9614 and is reached over an SSH tunnel, like Dozzle:
#   ssh -L 9614:localhost:9614 user@<server>   # then open http://localhost:9614
#
# Create buckets/users from the console, or with the mc CLI:
#   docker exec s3 mc alias set local http://localhost:9000 <user> <password>
#   docker exec s3 mc mb local/<bucket>

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  s3-data:
    driver: local
    name: s3-data

services:
  s3:
    container_name: s3
    image: pgsty/minio:${MINIO_TAG:-RELEASE.2026-06-18T00-00-00Z}
    hostname: s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_SITE_REGION: ${MINIO_SITE_REGION:-us-east-1}
    ports:
      - "127.0.0.1:9612:9000"
      - "127.0.0.1:9614:9001"
    volumes:
      - s3-data:/data
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"
