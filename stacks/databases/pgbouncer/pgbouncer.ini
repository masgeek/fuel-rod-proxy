[databases]
fuelrod = host=postgres port=5432 dbname=fuelrod
akilimo = host=postgres port=5432 dbname=akilimo
shirakalu = host=postgres port=5432 dbname=shirakalu

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
