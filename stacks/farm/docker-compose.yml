name: "farm"

# Farm Manager stack — deploy AFTER the databases stack.
# postgres is reachable via the shared 'dokploy-network' network.
# The 'uploads' volume is created by the fuelrod stack and shared here.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  uploads:
    driver: local
    name: uploads

services:
  farm-migrate:
    image: masgeek/farm-manager-migrate:${FARM_TAG:-latest}
    container_name: farm-migrate
    restart: no
    environment:
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_DATABASE: ${FARM_DB_DATABASE:-shirakalu}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?DEFAULT_PASSWORD is required}
      DB_SCHEMA: ${FARM_DB_SCHEMA:-public}
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - dokploy-network
      - internal

  farm-api:
    image: masgeek/farm-manager-api:${FARM_TAG:-latest}
    container_name: farm-api
    hostname: farm-api
    restart: unless-stopped
    environment:
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_DATABASE: ${FARM_DB_DATABASE:-shirakalu}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-604800}
      CLIENT_PROTOCOL: ${CLIENT_PROTOCOL:-https}
      CLIENT_HOST: ${CLIENT_HOST:-localhost}
      CLIENT_PORT: ${CLIENT_PORT:-443}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-localhost}
      NODE_ENV: production
      UPLOAD_DIR: ${UPLOAD_DIR:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_API_URL: ${MAILGUN_ENDPOINT:-https://api.eu.mailgun.net}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@shirakalu.farm}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_API_KEY: ${SMS_HTTP_API_KEY:-}
    volumes:
      - uploads:/repo/apps/api/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.farm-api.rule=Host(`${FARM_API_DOMAIN}`)"
      - "traefik.http.routers.farm-api.entrypoints=websecure"
      - "traefik.http.routers.farm-api.tls=true"
      - "traefik.http.routers.farm-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.farm-api.loadbalancer.server.port=3001"
    depends_on:
      farm-migrate:
        condition: service_completed_successfully
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  farm-web:
    image: masgeek/farm-manager-web:${FARM_TAG:-latest}
    container_name: farm-web
    hostname: farm-web
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.farm-web.rule=Host(`${FARM_WEB_DOMAIN}`)"
      - "traefik.http.routers.farm-web.entrypoints=websecure"
      - "traefik.http.routers.farm-web.tls=true"
      - "traefik.http.routers.farm-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.farm-web.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    depends_on:
      - farm-api
    networks:
      - dokploy-network
      - internal
