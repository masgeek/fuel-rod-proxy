name: "automation"

# Requires the 'databases' stack to be running first.
# postgres and cache are reachable via the shared 'dokploy-network' network.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  workflow-data:
    driver: local
    name: workflow-data

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_TAG:-latest}
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    #pull_policy: always
    environment:
      N8N_HOST: n8n.munywele.co.ke
      N8N_PROTOCOL: https
      N8N_PORT: 443
      N8N_EDITOR_BASE_URL: https://n8n.munywele.co.ke
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?N8N_WEBHOOK_URL must be set}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      N8N_METRICS: ${N8N_METRICS:-true}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      N8N_DISABLE_SIGNUP: ${N8N_DISABLE_SIGNUP:-true}
      QUEUE_HEALTH_CHECK_ACTIVE: ${N8N_QUEUE_HEALTH_CHECK_ACTIVE:-true}
      #N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED:-true}
      # N8N_RUNNERS_MODE: ${N8N_RUNNERS_MODE:-external}
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set}
      EXECUTIONS_DATA_PRUNE: ${N8N_EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_DATA_MAX_AGE:-14}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${N8N_EXECUTIONS_DATA_PRUNE_MAX_COUNT:-4}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
      EXECUTIONS_TIMEOUT: ${N8N_EXECUTIONS_TIMEOUT:-60}
      DB_TYPE: ${N8N_DB_TYPE:-postgresdb}
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_POSTGRESDB_SCHEMA: ${DB_WORKFLOW_SCHEMA:-workflow}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    ports:
      - "127.0.0.1:9700:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - workflow-data:/home/node/.n8n
    networks:
      - dokploy-network
      - internal

