name: "dozzle"

# Dozzle — Docker log viewer. Optional, deploy only when needed for debugging.
# Requires access to the Docker socket on the host.

networks:
  dokploy-network:
    name: dokploy-network
    external: true

services:
  dozzle:
    container_name: dozzle
    hostname: dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOZZLE_HOSTNAME: ${DOZZLE_HOSTNAME}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`${DOZZLE_DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    networks:
      - dokploy-network
