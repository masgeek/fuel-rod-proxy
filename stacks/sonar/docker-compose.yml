name: "sonar"

# SonarQube stack — deploy AFTER the databases stack.
# Requires a 'sonar' database in postgres (created by the databases init scripts).
# postgres is reachable via the shared 'dokploy-network' network.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  sonarqube_data:
    driver: local
    name: sonarqube-data
  sonarqube_extensions:
    driver: local
    name: sonarqube-extensions
  sonarqube_logs:
    driver: local
    name: sonarqube-logs

services:
  sonar:
    image: sonarqube:${SONAR_TAG:-community}
    container_name: sonar
    hostname: sonar
    restart: unless-stopped
    environment:
      # SONAR_JDBC_URL: ${SONAR_JDBC_URL:-jdbc:postgresql://postgres:5432/sonar}
      # SONAR_JDBC_USERNAME: ${POSTGRES_USER:?}
      # SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?}
      SONARR__POSTGRES__HOST: ${DB_HOST:-postgres}
      SONARR__POSTGRES__PORT: ${DB_PORT:-5432}
      SONARR__POSTGRES__USER: ${DB_USER:?}
      SONARR__POSTGRES__PASSWORD: ${DB_PASSWORD:?}
      SONARR__POSTGRES__MAINDB: ${DB_DATABASE:-sonarr}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    networks:
      - dokploy-network
      - internal
