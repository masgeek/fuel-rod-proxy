name: "use-uptake"

networks:
  dokploy-network:
    name: dokploy-network
    external: true

services:
  use-uptake:
    container_name: use-uptake
    hostname: use-uptake
    image: iita/use-uptake:${USE_UPTAKE_TAG:?USE_UPTAKE_TAG must be set}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - dokploy-network
