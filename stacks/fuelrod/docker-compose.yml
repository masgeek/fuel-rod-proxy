name: "fuelrod"

# Application stack — deploy AFTER databases and automation stacks.
# postgres, maria, redis, and n8n are in their own Coolify resources
# and reachable via the shared 'dokploy-network' network.

networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  uploads:
    driver: local
    name: uploads
  fuelrod-logs:
    name: fuelrod-logs
    driver: local
  migration:
    driver: local
    name: migration

services:
  fuelrod:
    container_name: fuelrod
    image: masgeek/fuelrod-service:${FUELROD_TAG:?FUELROD_TAG must be set}
    hostname: fuelrod
    restart: unless-stopped
    environment:
      PHP_FPM_PM_MAX_CHILDREN: ${PHP_FPM_PM_MAX_CHILDREN:-50}
      PHP_FPM_PM_START_SERVERS: ${PHP_FPM_PM_START_SERVERS:-10}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${PHP_FPM_PM_MIN_SPARE_SERVERS:-7}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${PHP_FPM_PM_MAX_SPARE_SERVERS:-15}
    volumes:
      - uploads:/var/www/html/fuelrod/public/uploads
      - fuelrod-logs:/var/log/supervisor
      - migration:/var/www/html/fuelrod/storage/app/migration
      - ../../config/supervisor/common/nginx.conf:/etc/supervisor/conf.d/nginx.conf
      - ../../config/supervisor/common/php-fpm.conf:/etc/supervisor/conf.d/php-fpm.conf
      - ../../config/supervisor/common/laravel-scheduler.conf:/etc/supervisor/conf.d/laravel-scheduler.conf
      - ../../config/supervisor/common/laravel-migrate.conf:/etc/supervisor/conf.d/laravel-migrate.conf
      - ../../config/supervisor/common/laravel-optimize.conf:/etc/supervisor/conf.d/laravel-optimize.conf
      - ../../config/supervisor/common/laravel-link.conf:/etc/supervisor/conf.d/laravel-link.conf
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

  portal:
    image: masgeek/fuelrod-sms-portal:${PORTAL_TAG:?PORTAL_TAG must be set}
    hostname: portal
    container_name: portal
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${FUELROD_API_URL:-http://fuelrod/api}
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    depends_on:
      fuelrod:
        condition: service_started
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  gateway:
    image: masgeek/fuelrod-sms-gateway:${GATEWAY_TAG:?GATEWAY_TAG must be set}
    hostname: sms-gateway
    container_name: gateway
    restart: unless-stopped
    environment:
      FUELROD_API_URL: ${FUELROD_API_URL:-http://fuelrod/api}
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

