name: "fuelrod"

# Application stack — deploy AFTER docker-compose-databases.yml and docker-compose-n8n.yml.
# postgres, maria, redis, and n8n are in their own Coolify resources and reachable
# via the shared 'coolify' network.

include:
  - compose/docker-compose.base.yml
  - compose/docker-compose.networks.yml
  - compose/services/docker-compose.fuelrod.yml
  - compose/services/docker-compose.farm.yml
  - compose/services/docker-compose.fees.yml
  - compose/services/docker-compose.redis-admin.yml
  - compose/services/docker-compose.metabase.yml
  - compose/services/docker-compose.dozzle.yml
  - compose/services/docker-compose.mailcatchers.yml

services:
  mantis:
      extends:
        file: compose/services/docker-compose-bug.yml
        service: mantis
      env_file:
        - .env
        - .env-akilimo
        - .env-fuelrod
  sonar:
    extends:
      file: compose/services/docker-compose.sonarqube.yml
      service: sonar
    env_file:
      - .env
      - .env-akilimo
      - .env-fuelrod
