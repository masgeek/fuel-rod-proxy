global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Laravel app
  - job_name: 'fuelrod-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['fuelrod:9000']

  # Node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['fuelrod:9000']

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']  # postgres_exporter endpoint
