name: openproject

services:
  openproject:
    image: openproject/openproject:16
    container_name: openproject
    hostname: openproject
    restart: unless-stopped
    environment:
      OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:-changemeplz1234567890}
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST:-${OPENPROJECT_DOMAIN}}
      OPENPROJECT_HTTPS: ${OPENPROJECT_HTTPS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - openproject_data:/var/openproject/assets
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openproject.rule=Host(`${OPENPROJECT_DOMAIN}`)"
      - "traefik.http.routers.openproject.entrypoints=https"
      - "traefik.http.routers.openproject.tls=true"
      - "traefik.http.routers.openproject.tls.certresolver=letsencrypt"
      - "traefik.http.services.openproject.loadbalancer.server.port=80"
    networks:
      - coolify
      - internal

volumes:
  openproject_data:
      driver: local
      name: openproject-data
