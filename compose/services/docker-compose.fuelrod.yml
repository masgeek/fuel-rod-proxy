name: "fuelrod"

services:

  fuelrod:
    container_name: fuelrod
    image: masgeek/fuelrod-service:${FUELROD_TAG:-latest}
    hostname: fuelrod
    restart: unless-stopped
    env_file:
      - ../../.env
      - ../../.env-fuelrod
    environment:
      # QUEUE_WORKERS: ${Q_WORKERS:-5}
      # QUEUE_HEAVY_WORKERS: ${Q_HEAVY_WORKERS:-1}
      # QUEUE_MAX_TRIES: ${Q_MAX_TRIES:-3}
      QUEUE_TIMEOUT: ${Q_TIMEOUT:-3600}
      QUEUE_SLEEP: ${Q_SLEEP:-3}
      PHP_FPM_PM_MAX_CHILDREN: ${FPM_MAX_CHILDREN:-50}
      PHP_FPM_PM_START_SERVERS: ${FPM_START_SERVERS:-10}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${FPM_MIN_SPARE:-7}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${FPM_MAX_SPARE:-15}
    volumes:
      - ../../uploads:/var/www/html/fuelrod/public/uploads
      - fuelrod-logs:/var/log/supervisor
      - ../../migration:/var/www/html/fuelrod/storage/app/migration
      - ../../config/fuelrod/api/supervisor/conf.d:/etc/supervisor/conf.d
    ports:
      - "9000:80"
    depends_on:
      postgres:
          condition: service_healthy
      cache:
          condition: service_healthy
      n8n:
          condition: service_healthy
      gateway: 
          condition: service_started
      exporter:
          condition: service_started
          
    networks:
      - web
      - internal
    healthcheck:
      test: [ "CMD", "curl","-f", "http://localhost/health" ]
      interval: 3600s
      timeout: 10s
      retries: 5
      start_period: 120s

  portal:
    image: masgeek/fuelrod-sms-portal:${PORTAL_TAG:-latest}
    hostname: portal
    container_name: portal
    restart: unless-stopped
    depends_on:
      fuelrod:
          condition: service_healthy
    ports:
      - "3004:80"
    networks:
      - web
      - internal

  gateway:
    image: masgeek/fuelrod-sms-gateway:${GATEWAY_TAG:-latest}
    hostname: sms-gateway
    container_name: gateway
    restart: unless-stopped
    environment:
      FUELROD_API_URL: ${FUELROD_API_URL:-http://fuelrod/api}
    ports:
      - "3006:80"
    networks:
      - web
      - internal