name: "fuelrod"

services:

  minio:
    image: minio/minio:${MINIO_TAG:-RELEASE.2024-03-26T22-10-45Z}
    # container_name: minio
    hostname: minio
    restart: unless-stopped
    # ports:
    #   - '9004:9000' # API
    #   - '9006:9001' # Console
    volumes:
      - minio_data:/data
    networks:
      # - web
      - internal

    command: server /data --console-address ":9001"
    environment:
      MINIO_STORAGE_CLASS_STANDARD: ${MINIO_STORAGE_CLASS_STANDARD:-EC:0}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fuelrod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-fuelrod}
      MINIO_SCHEME: ${MINIO_SCHEME:-http}
      MINIO_UPDATE: ${MINIO_UPDATE:-off}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://minio:9000}
      #MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9004}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: minio-nginx
    hostname: minio-nginx
    depends_on:
      - minio
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9005:80"
    restart: unless-stopped
    networks:
      - internal

volumes:
  minio_data:
    name: minio_data
    driver: local