name: "fuelrod"

services:

  fees:
    container_name: fees
    image: masgeek/fee-syncer:${SYNCER_TAG:-latest}
    hostname: fees
    restart: unless-stopped
    env_file:
      - ../../.env
      - ../../.env-fees
    environment:
      QUEUE_WORKERS: ${Q_WORKERS:-5}
      QUEUE_HEAVY_WORKERS: ${Q_HEAVY_WORKERS:-1}
      QUEUE_MAX_TRIES: ${Q_MAX_TRIES:-3}
      QUEUE_TIMEOUT: ${Q_TIMEOUT:-3600}
      QUEUE_SLEEP: ${Q_SLEEP:-3}
      PHP_FPM_PM_MAX_CHILDREN: ${FPM_MAX_CHILDREN:-50}
      PHP_FPM_PM_START_SERVERS: ${FPM_START_SERVERS:-10}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${FPM_MIN_SPARE:-7}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${FPM_MAX_SPARE:-15}
    volumes:
      - ../../log/supervisor:/var/log/supervisor
      - ../../config/fees/api/supervisor/conf.d:/etc/supervisor/conf.d
    ports:
      - "9000:80"
    depends_on:
      postgres:
          condition: service_healthy
      cache:
          condition: service_healthy
          
    networks:
      - web
      - internal
    healthcheck:
      test: [ "CMD", "curl","-f", "http://localhost/health" ]
      interval: 3600s
      timeout: 10s
      retries: 5
      start_period: 120s