name: "metrics"

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    hostname: loki
    ports:
      - "3100:3100"
    depends_on:
      - grafana
      - prometheus
    volumes:
      - loki_data:/loki
      - ./metrics/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - web
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    ports:
      - "5601:3000"
    environment:
      - POSTGRES_USER=grafana_user
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_HOST=postgres
      - POSTGRES_SCHEMA=fuelrod
      - POSTGRES_SSLMODE=disable
      - POSTGRES_PASSWORD=grafana_user
      - POSTGRES_DB=fuelrod
      - REDIS_HOST=cache:6379
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./metrics/grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./metrics/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./metrics/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    networks:
      - web
      - internal
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    command:
      - '--web.enable-remote-write-receiver'
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - web
      - internal
    restart: unless-stopped

  agent:
    image: grafana/agent:latest  # Use the latest for Flow mode
    container_name: grafana-agent
    hostname: grafana-agent
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    volumes:
      - fuelrod-logs:/var/log/supervisor:ro
      - ./metrics/agent:/etc/grafana-agent
      - agent-data:/tmp/agent-data  # For Flow mode storage
    entrypoint:
      - /bin/grafana-agent
      - -server.http.address=0.0.0.0:12345
      - -config.file=/etc/grafana-agent/agent.yaml
      - -metrics.wal-directory=/tmp/agent/wal
      - -enable-features=integrations-next
      - -config.expand-env
      - -config.enable-read-api
    environment:
      - LOKI_URL=http://loki:3100
      - JOB_NAME=fuelrod
      - INSTANCE=grafana-agent
      - HOST=${HOSTNAME:-unknown}
    ports:
      - "12345:12345"  # Agent UI and metrics
    networks:
      - internal
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12345/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pg-export:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pg-export
    hostname: pg-export
    restart: unless-stopped
    ports:
      - "9187:9187"   # default exporter port
    environment:
      - DATA_SOURCE_NAME=${GRAFANA_DB_URL:-postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable}
    networks:
      - internal
      - web
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


volumes:
  prometheus_data:
    driver: local
    name: prometheus-data
  grafana_data:
    driver: local
    name: grafana-data
  loki_data:
    driver: local
    name: loki-data
  agent-data:
    driver: local
    name: agent-data
