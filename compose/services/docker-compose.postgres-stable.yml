services:
  postgres:
    image: postgres:17
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-postgres}
    networks:
      - internal
      - web
    ports:
      - "5432:5432"
    volumes:
      - pgdata-main:/var/lib/postgresql/data
      - ../init/pgsql:/docker-entrypoint-initdb.d
      - type: bind
        source: ../../config/db/postgres/postgres.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: cleanstart/pgbouncer:1.25.1
    container_name: pgbouncer
    hostname: pgbouncer
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      PGBOUNCER_DATABASE: ${DB_DATABASE:-postgres}
      PGBOUNCER_PORT: ${PGBOUNCER_PORT:-6432}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
    volumes:
      - ../../config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../../config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-main:
    driver: local
    name: pgdata-main