services:
  ana-django:
    container_name: ana-django
    hostname: ana-django
    image: iita/ana-dashboard:${ANA_TAG:?ANA_TAG must be set}
    volumes:
      - ./static:/var/www/static
    environment:
        SECRET_KEY: ${ANA_SECRET_kEY}
        DJANGO_DEBUG: ${DJANGO_DEBUG}
        ALLOWED_HOSTS: ${ALLOWED_HOSTS}
        CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
    restart: unless-stopped
    networks:
      - internal

  ana-dashboard:
    container_name: ana-dashboard
    hostname: ana-dashboard
    image: nginx:latest
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/var/www/static/static:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ana.rule=Host(`${ANA_DOMAIN}`)"
      - "traefik.http.routers.ana.entrypoints=https"
      - "traefik.http.routers.ana.tls=true"
      - "traefik.http.routers.ana.tls.certresolver=letsencrypt"
      - "traefik.http.services.ana.loadbalancer.server.port=80"
    depends_on:
      - ana-django
    networks:
      - coolify
      - internal
