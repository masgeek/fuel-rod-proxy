name: "fuelrod"

services:

  farm-api:
    image: masgeek/farm-manager-api:${TAG:-latest}
    container_name: farm-api
    hostname: farm-api
    restart: unless-stopped
    environment:
      POSTGRES_USER:       ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD:   ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST:       postgres
      POSTGRES_PORT:       5432
      POSTGRES_DB:         ${POSTGRES_DB:-shirakalu}
      JWT_SECRET:          ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-604800}
      CLIENT_ORIGIN:       ${CLIENT_ORIGIN:-http://localhost}
      NODE_ENV:            production
      # File uploads (optional — defaults to apps/api/uploads inside the container)
      UPLOAD_DIR:          ${UPLOAD_DIR:-}
      # Email — Option 1: Mailgun REST API
      MAILGUN_API_KEY:     ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN:      ${MAILGUN_DOMAIN:-}
      MAILGUN_API_URL:     ${MAILGUN_API_URL:-api.eu.mailgun.net}
      # Email — Option 2: SMTP via Nodemailer (used when Mailgun vars are absent)
      SMTP_HOST:           ${SMTP_HOST:-}
      SMTP_PORT:           ${SMTP_PORT:-587}
      SMTP_USER:           ${SMTP_USER:-}
      SMTP_PASS:           ${SMTP_PASS:-}
      SMTP_FROM:           ${SMTP_FROM:-noreply@shirakalu.farm}
      # SMS — Option 1: Africa's Talking SDK
      AT_API_KEY:          ${AT_API_KEY:-}
      AT_USERNAME:         ${AT_USERNAME:-}
      AT_SENDER_ID:        ${AT_SENDER_ID:-}
      # SMS — Option 2: Generic HTTP POST API (used when AT vars are absent)
      SMS_HTTP_URL:        ${SMS_HTTP_URL:-}
      SMS_HTTP_API_KEY:    ${SMS_HTTP_API_KEY:-}
    volumes:
      - uploads:/repo/apps/api/uploads
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      farm-migrate:
        condition: service_completed_successfully
    networks:
      - web
      - internal
    healthcheck:
      test: [ "CMD", "curl","-f", "http://localhost:3001/health" ]
      interval: 3600s
      timeout: 10s
      retries: 5
      start_period: 120s

  farm-web:
    image: masgeek/farm-manager-web:${TAG:-latest}
    container_name: farm-web
    hostname: farm-web
    restart: unless-stopped
    environment:
      # Option 1 — env var: entrypoint writes config.json at startup from this value.
      # Leave blank (or remove) when using Option 2.
      API_URL: ${API_URL:-}
    # Option 2 — volume mount: provide a pre-prepared config.json.
    # Comment out API_URL above and uncomment the volume below.
    # volumes:
    #   - ./config.json:/usr/share/nginx/html/config.json:ro
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - farm-api
    networks:
      - web
      - internal

  farm-migrate:
    image: masgeek/farm-manager-migrate:${TAG:-latest}
    container_name: farm-migrate
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-shirakalu}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?DEFAULT_PASSWORD}
      DB_SCHEMA:         ${FARM_DB_SCHEMA:-public}
    depends_on:
      postgres:
        condition: service_healthy
    restart: no
    networks:
      - web
      - internal


volumes:
  uploads:
    driver: local
    name: uploads