services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql
    hostname: mssql
    restart: unless-stopped
    ports:
      - "1433:1433"
    networks:
      - internal
      - web
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Express}
    volumes:
      - mssql-data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sqlinit:
    image: mcr.microsoft.com/mssql-tools
    container_name: sqlinit
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"
    networks:
      - internal
    volumes:
      - ../init/mssql:/init-scripts
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    entrypoint: ["/bin/bash"]
    command:
      - -c
      - |
        echo 'Waiting for SQL Server to start...';
        
        # Find sqlcmd
        SQLCMD_PATH=$$(find /opt -name sqlcmd -type f 2>/dev/null | head -1)
        
        if [ -z "$$SQLCMD_PATH" ]; then
          echo "ERROR: sqlcmd not found!";
          exit 1;
        fi
        
        echo "Found sqlcmd at: $$SQLCMD_PATH";
        
        for f in /init-scripts/*.sql; do
          if [ -f "$$f" ]; then
            echo "Running init script: $$f";
            "$$SQLCMD_PATH" -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -i "$$f";
            if [ $$? -ne 0 ]; then
              echo "Error running script: $$f";
              exit 1;
            else
              echo "Successfully ran: $$f";
            fi
          fi
        done;
        echo 'Init scripts complete';

  sqlcmd:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: sqlcmd
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - internal
      - web
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - mssql
      - -U
      - sa
      - -P
      - "${MSSQL_SA_PASSWORD}"
      - -C
    tty: true
    stdin_open: true

volumes:
  mssql-data:
    driver: local
    name: mssql-data