name: "metabase"

services:
  mbase:
    container_name: mbase
    hostname: metabase
    image: metabase/metabase:v0.57.x
    restart: unless-stopped
    ports:
      - 3006:3000
    environment:
      MB_DB_TYPE: ${MB_DB_TYPE:-postgres}
      MB_DB_DBNAME: metabase
      MB_DB_PORT: ${DB_PORT:-5432}
      MB_DB_USER: ${DB_USERNAME}
      MB_DB_PASS: ${DB_PASSWORD}
      MB_DB_HOST: ${MB_DB_HOST:-postgres}
      JAVA_TIMEZONE: ${JAVA_TIMEZONE:-UTC}
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 1m30s
      timeout: 10s
      retries: 5
      # start_period: 2m
    # volumes:
    #   - metabase-data:/metabase-data
    networks:
      - web
      - internal
