
services:
  db:
    container_name: db
    hostname: db
    image: postgres:18.0
    restart: unless-stopped
    volumes:
      - nextcloud-db:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_db_password}

  nextcloud:
    container_name: nextcloud
    hostname: nextcloud
    image: nextcloud:32.0.1
    restart: unless-stopped
    ports:
      - "9008:80"   # expose only to localhost if Nginx will proxy
    depends_on:
      - db
    environment:
      NEXTCLOUD_ADMIN_USER : ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD : ${NEXTCLOUD_ADMIN_PASSWORD:-andalite6}
      NEXTCLOUD_TRUSTED_DOMAINS : ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_db_password}
    volumes:
      - nextcloud-data:/var/www/html
      - nextcloud-config:/var/www/html/config
      - nextcloud-apps:/var/www/html/custom_apps

volumes:
  nextcloud-db:
  nextcloud-data:
  nextcloud-config:
  nextcloud-apps:
