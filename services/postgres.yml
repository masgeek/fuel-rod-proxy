services:
  postgres:
    image: postgres:17
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-postgres}
    networks:
      - coolify
      - internal
    # Uncomment to allow direct DB access from the host (admin use only):
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata-main:/var/lib/postgresql/data
      - config/init/pgsql:/docker-entrypoint-initdb.d
      - type: bind
        source: config/db/postgres/postgres.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    hostname: pgbouncer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${DB_DATABASE}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
    # Uncomment to allow direct pgbouncer access from the host:
    # ports:
    #   - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coolify
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-main:
    driver: local
    name: pgdata-main
