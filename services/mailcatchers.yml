services:
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    hostname: mailpit
    restart: unless-stopped
    volumes:
      - smtp:/data
    ports:
      - "1025:1025"   # SMTP — kept as port binding for app relay
    environment:
      MP_VERBOSE: true
      MP_MAX_MESSAGES: ${MAX_EMAILS:-1000}
      MP_MAX_AGE: 1h
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`${MAILPIT_DOMAIN}`)"
      - "traefik.http.routers.mailpit.entrypoints=https"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.routers.mailpit.tls.certresolver=letsencrypt"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    networks:
      - coolify
      - internal
