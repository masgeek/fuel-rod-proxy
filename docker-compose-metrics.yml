name: "metrics"

# Monitoring stack: Prometheus, Loki, Grafana, Grafana Agent, pg-export.
# Requires the 'databases' stack to be running (pg-export connects to postgres).
# fuelrod-logs volume is shared with the fuelrod app stack for log tailing.

include:
  - compose/docker-compose.base.yml
  - compose/docker-compose.networks.yml
  - compose/services/docker-compose.metrics.yml
