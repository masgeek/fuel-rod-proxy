name: "databases"

# Deploy this stack FIRST before any application stack.
# All databases join the 'coolify' network so services in other
# Coolify resources can reach them by hostname.

include:
  - compose/docker-compose.base.yml
  - compose/docker-compose.networks.yml
  - compose/services/docker-compose.postgres.yml
  - compose/services/docker-compose.maria.yml
  - compose/services/docker-compose.redis.yml
